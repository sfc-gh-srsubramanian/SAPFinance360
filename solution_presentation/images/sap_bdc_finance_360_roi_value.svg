<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#29B5E8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e88c7;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Business Value — SAP BDC Finance 360</text>
  <text x="600" y="68" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">Annual ROI from eliminating ETL, accelerating close, and enabling self-service</text>

  <!-- Central value circle -->
  <circle cx="600" cy="320" r="130" fill="none" stroke="url(#blueGrad)" stroke-width="4"/>
  <circle cx="600" cy="320" r="115" fill="#0c2d48" opacity="0.8"/>
  <text x="600" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#94a3b8">TOTAL ANNUAL VALUE</text>
  <text x="600" y="335" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#29B5E8">$4.7M</text>
  <text x="600" y="365" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">per enterprise (conservative)</text>

  <!-- Value Driver 1: Top Left -->
  <g transform="translate(80, 100)" filter="url(#shadow)">
    <rect width="280" height="140" rx="12" fill="#1e293b"/>
    <rect width="280" height="4" rx="2" fill="#30D158" y="0"/>
    <text x="140" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#30D158">ETL ELIMINATION</text>
    <text x="140" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">$2.0M</text>
    <text x="140" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">Pipeline maintenance, infra,</text>
    <text x="140" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">engineering headcount savings</text>
    <text x="140" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">Source: Gartner TCO Study 2024</text>
  </g>

  <!-- Value Driver 2: Top Right -->
  <g transform="translate(840, 100)" filter="url(#shadow)">
    <rect width="280" height="140" rx="12" fill="#1e293b"/>
    <rect width="280" height="4" rx="2" fill="#F39C12" y="0"/>
    <text x="140" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#F39C12">FASTER CLOSE</text>
    <text x="140" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">$1.2M</text>
    <text x="140" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">7 days recovered × $170K/day</text>
    <text x="140" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">opportunity cost of delayed decisions</text>
    <text x="140" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">Source: Deloitte CFO Survey 2024</text>
  </g>

  <!-- Value Driver 3: Bottom Left -->
  <g transform="translate(80, 460)" filter="url(#shadow)">
    <rect width="280" height="140" rx="12" fill="#1e293b"/>
    <rect width="280" height="4" rx="2" fill="#a78bfa" y="0"/>
    <text x="140" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">SELF-SERVICE ADOPTION</text>
    <text x="140" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">$900K</text>
    <text x="140" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">2,400 analyst hours redirected</text>
    <text x="140" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">from data gathering to analysis</text>
    <text x="140" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">Source: McKinsey Digital Finance 2024</text>
  </g>

  <!-- Value Driver 4: Bottom Right -->
  <g transform="translate(840, 460)" filter="url(#shadow)">
    <rect width="280" height="140" rx="12" fill="#1e293b"/>
    <rect width="280" height="4" rx="2" fill="#FF6B6B" y="0"/>
    <text x="140" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FF6B6B">LEAKAGE PREVENTION</text>
    <text x="140" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f5f9">$600K</text>
    <text x="140" y="95" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">AP/AR anomaly detection,</text>
    <text x="140" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94a3b8">duplicate payment prevention</text>
    <text x="140" y="132" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">Source: PwC Finance Benchmark 2024</text>
  </g>

  <!-- Connecting lines from drivers to center -->
  <line x1="360" y1="170" x2="490" y2="270" stroke="#30D158" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="840" y1="170" x2="710" y2="270" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="360" y1="530" x2="490" y2="380" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="840" y1="530" x2="710" y2="380" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Timeline bar -->
  <g transform="translate(380, 640)">
    <rect width="440" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="110" height="30" rx="15" fill="#30D158" opacity="0.3"/>
    <text x="55" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#30D158">Day 1</text>
    <text x="165" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#94a3b8">Week 1</text>
    <text x="275" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#94a3b8">Month 1</text>
    <text x="385" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#94a3b8">Month 3</text>
  </g>
  <text x="600" y="632" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">Time to Value</text>
</svg>
